services:
  9router:
    # Built from this repo, not the published image: the Gemini-native endpoint
    # here carries fixes that decolua/9router:latest does not have.
    build: .
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      # Bind mount, not a named volume: this is the path the pre-compose
      # `docker run` deployment used, so an existing install keeps its accounts,
      # API keys and usage history instead of coming up empty.
      - ${HOME}/.9router:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
