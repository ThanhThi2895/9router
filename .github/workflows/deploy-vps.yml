name: Deploy to VPS

# Manual only. The gateway serves live traffic, so a deploy is a deliberate act
# rather than a side effect of pushing to master. `docker-publish.yml` still owns
# the public `decolua/9router` release flow driven by `v*` tags.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase path segments, and the owner here is mixed case.
      - name: Resolve lowercase image reference
        id: image
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=vps
            type=sha,format=long

      # amd64 only: this image is for one known VPS, and dropping the arm64 leg
      # roughly halves build time compared to the public multi-arch release.
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_MIRROR=dl-cdn.alpinelinux.org
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production
    permissions:
      packages: read

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -e

            echo "=== Login to GHCR ==="
            # GITHUB_TOKEN is minted per-run and cannot expire mid-deploy the way
            # a stored PAT can. The job's packages:read permission is all it needs.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            FULL_IMAGE="${{ needs.build.outputs.image }}:vps"
            APP_DIR="${{ vars.VPS_APP_DIR }}"

            echo "=== Pulling image: $FULL_IMAGE ==="
            docker pull "$FULL_IMAGE"

            echo "=== Restarting containers ==="
            docker compose -f "$APP_DIR/docker-compose.yml" pull
            docker compose -f "$APP_DIR/docker-compose.yml" up -d --remove-orphans

            echo "=== Cleaning up old Docker images ==="
            docker image prune -f

            echo "Deploy finished."

      - name: Discord success notification
        if: success()
        uses: rjstone/discord-webhook-notify@v2
        with:
          severity: info
          description: |
            - **Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})
            - **Workflow:** ${{ github.workflow }}
            - **Image:** ${{ needs.build.outputs.image }}:vps
            - **Triggering Actor:** ${{ github.actor }}
          details: "Deploy succeeded — ${{ github.repository }}"
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord failure notification
        if: failure()
        uses: rjstone/discord-webhook-notify@v2
        with:
          severity: error
          description: |
            - **Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})
            - **Workflow:** ${{ github.workflow }}
            - **Triggering Actor:** ${{ github.actor }}
          details: "Deploy failed — ${{ github.repository }} — Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
